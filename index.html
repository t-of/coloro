<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f2">
  <meta name="description" content="6色の駒を取り合って一番高い山を作る対戦ゲーム。">
  <title>coloro — 色の山で競う2人用パズル</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="coloro">
  <meta property="og:title" content="coloro — 色の山で競う2人用パズル">
  <meta property="og:description" content="6色の駒を取り合って一番高い山を作る対戦ゲーム。">
  <meta property="og:url" content="https://t-of.github.io/coloro/">
  <meta property="og:image" content="https://t-of.github.io/coloro/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="coloro">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">coloro</h1>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <p class="status" id="status"></p>
      <div class="row" id="row-p2"></div>
      <div class="board" id="board"></div>
      <div class="row" id="row-p1"></div>
    </section>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay__card">
        <p class="overlay__title" id="overlay-title"></p>
        <p class="overlay__reason" id="overlay-reason"></p>
        <button class="pill" id="again">もう一度</button>
      </div>
    </div>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ ·
      <a href="https://t-of.github.io/contact/">問い合わせ</a>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script src="./main.js"></script>
</body>
</html>
